services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # DATABASE_URL do .env (ex.: Supabase) tem prioridade; sem ela, cai no
      # Postgres do próprio compose.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/attendant}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendant
    ports:
      # Exposto para rodar `npm run dev` fora do container contra este banco.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendant"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Evolution API (opcional — claude.md §9). Descomente para subir junto.
  # A instância oficial da empresa normalmente já roda no mesmo servidor;
  # este bloco existe para quem clona o projeto e quer tudo local.
  # evolution:
  #   image: evoapicloud/evolution-api:latest
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     AUTHENTICATION_API_KEY: change-me
  #     WEBHOOK_GLOBAL_ENABLED: "true"
  #     WEBHOOK_GLOBAL_URL: http://app:3000/webhook/whatsapp
  #   volumes:
  #     - evolution_instances:/evolution/instances

volumes:
  pgdata:
